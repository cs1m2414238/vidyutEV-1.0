spring:
  profiles:
    active: dev
  application:
    name: vidyut-backend
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration/{vendor}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:no-reply@vidyut.local}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080

vidyut:
  oauth:
    google-client-id: ${GOOGLE_CLIENT_ID:558967442483-k5mnia7mcfjal59sjfgcn2iumn8pku3g.apps.googleusercontent.com}
    google-client-ids: ${GOOGLE_CLIENT_IDS:${GOOGLE_CLIENT_ID:558967442483-k5mnia7mcfjal59sjfgcn2iumn8pku3g.apps.googleusercontent.com}}
  payments:
    demo-enabled: false
  agent:
    base-url: ${VIDYUT_AGENT_BASE_URL:http://localhost:8001}
